services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: drishti
      POSTGRES_DB: drishti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://drishti:drishti@postgres:5432/drishti
      DETECTOR_BACKEND: auto
      AI_DEVICE: cpu
      OCR_ENGINE: easyocr
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
